<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始猜数字</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body{
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .card{
            background:#fff;
            border-radius:20px;
            padding:30px;
            max-width:420px;
            width:100%;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(15px);}
            to {opacity:1; transform: translateY(0);}
        }
        h2{color:#1e40af;margin-bottom:16px;text-align:center;}
        p{color:#333;line-height:1.7;font-size:16px;text-align:center;}
        input{
            width:100%;
            padding:14px;
            border:2px solid #93c5fd;
            border-radius:12px;
            font-size:17px;
            margin:12px 0;
            outline:none;
        }
        input:focus{border-color:#3b82f6;}
        .btn{
            width:100%;
            background:#3b82f6;
            color:white;
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:17px;
            margin:8px 0;
            transition:0.2s;
            cursor:pointer;
        }
        .btn:hover{background:#1d4ed8;transform:scale(1.02);}
        .back-home{
            background:#64748b;
        }
        .back-about{
            background:#0284c7;
        }
        #tip{
            font-weight:bold;
            margin:12px 0;
            font-size:18px;
        }
        /* 弹窗样式 */
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            align-items:center;
            justify-content:center;
        }
        .modal-box{
            background:white;
            padding:30px;
            border-radius:20px;
            text-align:center;
            max-width:350px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>猜数字</h2>
        <p>我想好了1~100的数字，快来猜！</p>
        <input type="number" id="guessNum" placeholder="输入数字" min="1" max="100">
        <button class="btn" onclick="checkNum()">提交猜测</button>
        <div id="tip"></div>
        <button class="btn" onclick="resetGame()">重新开始</button>
        <a href="about.html"><button class="btn back-about">👤 返回自我介绍</button></a>
        <a href="index.html"><button class="btn back-home">返回主页</button></a>
    </div>

    <!-- 庆祝弹窗 -->
    <div class="modal" id="winModal">
        <div class="modal-box">
            <h2>🎉恭喜！猜对啦！</h2>
            <p id="winText"></p>
            <button class="btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

<script>
//随机生成1-100数字
let secretNum = Math.floor(Math.random() * 100) + 1;
let count = 0;
const tip = document.getElementById("tip");
const modal = document.getElementById("winModal");
const winText = document.getElementById("winText");

function checkNum(){
    let val = document.getElementById("guessNum").value;
    if(!val){
        tip.innerText="⚠️请输入数字！";
        tip.style.color="#ef4444";
        return;
    }
    let guess = Number(val);
    count++;
    if(guess > secretNum){
        tip.innerText=`📈太大了！已经猜了${count}次`;
        tip.style.color="#f97316";
    }else if(guess < secretNum){
        tip.innerText=`📉太小了！已经猜了${count}次`;
        tip.style.color="#f97316";
    }else{
        tip.innerText=`🎉猜对！一共猜了${count}次！`;
        tip.style.color="#16a34a";
        //弹出弹窗
        winText.innerText = `你只用了${count}次就猜中！太厉害！`;
        modal.style.display = "flex";
    }
}

function resetGame(){
    secretNum = Math.floor(Math.random() * 100) + 1;
    count = 0;
    tip.innerText="";
    document.getElementById("guessNum").value="";
    closeModal();
}

function closeModal(){
    modal.style.display = "none";
}
</script>
</body>
</html>
