<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>士兵跑酷 · 躲避伊朗导弹</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: #1a1e2c;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Courier New', Courier, monospace; padding: 12px;
    }
    .game-wrapper {
      background: #2a2f42; padding: 20px 20px 24px; border-radius: 32px;
      box-shadow: 0 12px 0 #0f121c, 0 16px 24px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; align-items: center; position: relative;
      max-width: 100%;
    }
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; }
    .back-btn {
      background: #3a4258; color: #d4e8b0; border: none; border-radius: 14px;
      padding: 10px 18px; font-family: inherit; font-size: 1rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 5px 0 #1a1e2c; transition: all 0.05s ease;
      letter-spacing: 1px; text-decoration: none; display: inline-block;
    }
    .back-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1a1e2c; }
    .back-btn:hover { background: #4a5470; }
    canvas {
      display: block; width: 100%; height: auto;
      image-rendering: pixelated; image-rendering: crisp-edges;
      border-radius: 16px; background: #87CEEB;
      box-shadow: inset 0 0 0 4px #1e2430, 0 8px 0 #0f121c;
      cursor: pointer; max-width: 800px; touch-action: none;
    }
    .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; color: #e0f0c0; text-shadow: 2px 2px 0 #0f121c; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; padding: 0 8px; }
    .score { background: #1e2430; padding: 6px 20px; border-radius: 30px; box-shadow: inset 0 -4px 0 #0b0e15, 0 4px 0 #0b0e15; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
    .score span { color: #ffd966; font-size: 1.8rem; line-height: 1; }
    .controls-hint { color: #8faa7a; font-size: 1rem; font-weight: bold; display: flex; gap: 12px; background: #1e2430; padding: 6px 16px; border-radius: 30px; box-shadow: inset 0 -3px 0 #0b0e15; }
    .action-btns { display: flex; gap: 24px; margin-top: 16px; justify-content: center; }
    .action-btn {
      background: #4a6741; min-width: 120px; height: 70px; border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: bold; color: #d4e8b0;
      text-shadow: 3px 3px 0 #1f2e1a;
      box-shadow: 0 8px 0 #1f2e1a, 0 6px 12px rgba(0,0,0,0.5);
      transition: all 0.05s ease; touch-action: manipulation;
      cursor: pointer; user-select: none; border: none; padding: 0 20px;
    }
    .action-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #1f2e1a, 0 6px 12px rgba(0,0,0,0.5); background: #5d7e52; }
    @media (max-width: 600px) {
      .action-btn { min-width: 90px; height: 60px; font-size: 1.3rem; border-radius: 20px; }
      .hud { font-size: 1.2rem; }
      .score span { font-size: 1.5rem; }
      .back-btn { font-size: 0.9rem; padding: 8px 14px; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="top-bar">
    <a class="back-btn" href="index.html">← 返回</a>
    <div class="score">💥 距离 <span id="scoreDisplay">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div class="hud">
    <div class="controls-hint">空格/↑跳跃 ↓下滑</div>
  </div>

  <div class="action-btns">
    <button class="action-btn" id="jumpBtn">⬆ 跳跃</button>
    <button class="action-btn" id="duckBtn">⬇ 下滑</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const CANVAS_W = 800;
  const CANVAS_H = 400;
  const GROUND_Y = 330;
  const GRAVITY = 0.65;
  const JUMP_FORCE = -12;
  const PLAYER_X = 120;

  let gameState = 'start';
  let distance = 0;
  let highScore = 0;
  let speed = 5;
  let deathReason = '';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');

  let player = {
    y: GROUND_Y, vy: 0, isJumping: false, isDucking: false,
    w: 36, h: 60, duckH: 34,
    // 动画状态
    runCycle: 0,
    squash: 0,        // 起跳/落地压缩
    duckSlide: 0,     // 下滑进度 0→1
    landDust: 0,      // 落地尘土计时
    jumpStretch: 0    // 跳跃拉伸
  };

  let obstacles = [];
  let missile = {
    x: CANVAS_W + 100, y: GROUND_Y - 40, w: 90, h: 28,
    active: false, trail: [], warnTimer: 0
  };

  let particles = [];
  let dustParticles = [];
  let missileParticles = [];
  let clouds = [];
  let farHills = [];
  let nearBushes = [];
  let frameCount = 0;
  let spawnTimer = 0;
  let missileSpawnTimer = 0;
  let missileActive = false;
  let shake = 0;
  let bgScrollFar = 0;
  let bgScrollNear = 0;

  const keys = { jump: false, duck: false };

  function resetGame() {
    gameState = 'playing';
    distance = 0;
    speed = 5;
    deathReason = '';
    player.y = GROUND_Y;
    player.vy = 0;
    player.isJumping = false;
    player.isDucking = false;
    player.runCycle = 0;
    player.squash = 0;
    player.duckSlide = 0;
    player.landDust = 0;
    player.jumpStretch = 0;
    obstacles = [];
    particles = [];
    dustParticles = [];
    missileParticles = [];
    missile = {
      x: CANVAS_W + 100, y: GROUND_Y - 40, w: 90, h: 28,
      active: false, trail: [], warnTimer: 0
    };
    missileActive = false;
    missileSpawnTimer = 0;
    spawnTimer = 0;
    frameCount = 0;
    shake = 0;
    bgScrollFar = 0;
    bgScrollNear = 0;
    updateScoreUI();
    initClouds();
    initScenery();
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * CANVAS_W,
        y: 40 + Math.random() * 120,
        w: 60 + Math.random() * 60,
        h: 20 + Math.random() * 15,
        speed: 0.3 + Math.random() * 0.5
      });
    }
  }

  function initScenery() {
    farHills = [];
    for (let i = 0; i < 8; i++) {
      farHills.push({
        x: i * 160 + Math.random() * 40,
        w: 140 + Math.random() * 80,
        h: 50 + Math.random() * 50
      });
    }
    nearBushes = [];
    for (let i = 0; i < 12; i++) {
      nearBushes.push({
        x: i * 100 + Math.random() * 40,
        w: 40 + Math.random() * 30,
        h: 12 + Math.random() * 14
      });
    }
  }

  function updateScoreUI() {
    scoreSpan.textContent = Math.floor(distance / 10);
  }

  function spawnObstacle() {
    if (missileActive) return;

    const types = ['cactus', 'crate', 'barrier'];
    const type = types[Math.floor(Math.random() * types.length)];
    let obs;

    if (type === 'cactus') {
      const h = 40 + Math.random() * 40;
      obs = { x: CANVAS_W + 40, y: GROUND_Y - h, w: 24, h: h, type: 'cactus', passed: false };
    } else if (type === 'crate') {
      const size = 36 + Math.random() * 20;
      obs = { x: CANVAS_W + 40, y: GROUND_Y - size, w: size, h: size, type: 'crate', passed: false };
    } else {
      obs = { x: CANVAS_W + 40, y: GROUND_Y - 50, w: 30, h: 50, type: 'barrier', passed: false };
    }

    if (missileActive && missile.active) {
      const mx = missile.x;
      const mw = missile.w;
      if (obs.x < mx + mw + 80 && obs.x + obs.w > mx - 80) {
        return;
      }
    }

    obstacles.push(obs);
  }

  function spawnMissile() {
    const safeZoneStart = CANVAS_W * 0.35;
    obstacles = obstacles.filter(o => o.x < safeZoneStart);

    missileActive = true;
    missile = {
      x: CANVAS_W + 250,
      y: GROUND_Y - 60 - Math.random() * 60,
      w: 100,
      h: 30,
      active: true,
      trail: [],
      warnTimer: 90
    };
  }

  function updateMissile() {
    if (!missileActive) return;

    if (missile.warnTimer > 0) {
      missile.warnTimer--;
      return;
    }

    missile.x -= speed * 1.6;

    missile.trail.unshift({ x: missile.x + missile.w, y: missile.y + missile.h / 2, life: 1.0 });
    if (missile.trail.length > 20) missile.trail.pop();
    for (let t of missile.trail) t.life -= 0.04;
    missile.trail = missile.trail.filter(t => t.life > 0);

    // 导弹尾焰粒子
    if (Math.random() < 0.8) {
      missileParticles.push({
        x: missile.x - 8 + Math.random() * 10,
        y: missile.y + missile.h / 2 + (Math.random() - 0.5) * 8,
        vx: -2 - Math.random() * 3,
        vy: (Math.random() - 0.5) * 2,
        life: 0.5 + Math.random() * 0.5,
        maxLife: 1,
        size: 3 + Math.random() * 5,
        color: Math.random() > 0.5 ? '#ff6600' : '#ffcc00'
      });
    }

    if (missile.x + missile.w < -100) {
      missileActive = false;
      missile.active = false;
    }
  }

  function updateMissileParticles() {
    for (let i = missileParticles.length - 1; i >= 0; i--) {
      const p = missileParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= 0.03;
      if (p.life <= 0) missileParticles.splice(i, 1);
    }
  }

  function checkMissileCollision() {
    if (!missileActive || !missile.active) return false;
    if (missile.warnTimer > 0) return false;
    const px = PLAYER_X + 6;
    const pw = player.w - 12;
    const py = player.isDucking ? GROUND_Y - player.duckH : player.y - player.h;
    const ph = player.isDucking ? player.duckH : player.h;

    if (px < missile.x + missile.w &&
        px + pw > missile.x &&
        py < missile.y + missile.h &&
        py + ph > missile.y) {
      return true;
    }
    return false;
  }

  function checkObstacleCollision() {
    for (let obs of obstacles) {
      const px = PLAYER_X + 8;
      const pw = player.w - 16;
      const py = player.isDucking ? GROUND_Y - player.duckH : player.y - player.h;
      const ph = player.isDucking ? player.duckH : player.h;

      if (px < obs.x + obs.w && px + pw > obs.x &&
          py < obs.y + obs.h && py + ph > obs.y) {
        return true;
      }
    }
    return false;
  }

  function createExplosion(x, y) {
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.5) * 14 - 3,
        life: 1.0,
        maxLife: 1.0,
        color: Math.random() > 0.5 ? '#ff4400' : '#ffaa00',
        size: 4 + Math.random() * 6
      });
    }
    shake = 14;
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.02;
      p.vx *= 0.98;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = dustParticles.length - 1; i >= 0; i--) {
      const d = dustParticles[i];
      d.x += d.vx;
      d.y += d.vy;
      d.vy += 0.05;
      d.vx *= 0.96;
      d.life -= 0.025;
      d.size *= 0.98;
      if (d.life <= 0) dustParticles.splice(i, 1);
    }
  }

  function spawnRunDust() {
    // 跑步时脚下扬尘
    if (!player.isJumping) {
      const py = GROUND_Y;
      dustParticles.push({
        x: PLAYER_X + 10 + Math.random() * 10,
        y: py - 2 - Math.random() * 4,
        vx: -1 - Math.random() * 2,
        vy: -0.5 - Math.random() * 1.5,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        size: 2 + Math.random() * 3,
        color: 'rgba(180, 160, 120, 0.7)'
      });
    }
  }

  function spawnLandDust() {
    // 落地尘土
    for (let i = 0; i < 10; i++) {
      dustParticles.push({
        x: PLAYER_X + 8 + Math.random() * 20,
        y: GROUND_Y - 2,
        vx: -2 - Math.random() * 3,
        vy: -1 - Math.random() * 2.5,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        size: 3 + Math.random() * 4,
        color: 'rgba(190, 170, 130, 0.8)'
      });
    }
  }

  function gameOver(reason) {
    gameState = 'gameover';
    deathReason = reason;
    const scoreVal = Math.floor(distance / 10);
    if (scoreVal > highScore) highScore = scoreVal;
    createExplosion(PLAYER_X + player.w / 2, player.y - player.h / 2);
  }

  function update() {
    if (gameState !== 'playing') {
      // 结束时的粒子继续更新
      updateParticles();
      updateMissileParticles();
      if (shake > 0) shake *= 0.9;
      return;
    }

    frameCount++;
    player.runCycle += 0.28;

    // 压缩/拉伸恢复
    player.squash *= 0.85;
    player.jumpStretch *= 0.9;

    // 下滑进度
    if (player.isDucking) {
      player.duckSlide = Math.min(1, player.duckSlide + 0.25);
    } else {
      player.duckSlide = Math.max(0, player.duckSlide - 0.25);
    }

    distance += speed;
    speed = Math.min(12, 5 + distance / 2000);
    updateScoreUI();

    // 背景视差滚动
    bgScrollFar += speed * 0.15;
    bgScrollNear += speed * 0.5;

    // 跳跃物理
    if (player.isJumping) {
      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.isJumping = false;
        player.squash = 1;        // 落地压缩
        spawnLandDust();
        shake = Math.max(shake, 3);
      }
    }

    // 跑步扬尘
    if (frameCount % 4 === 0 && !player.isJumping) {
      spawnRunDust();
    }

    spawnTimer++;
    const spawnInterval = Math.max(45, 90 - Math.floor(distance / 500));
    if (spawnTimer > spawnInterval) {
      spawnTimer = 0;
      spawnObstacle();
    }

    missileSpawnTimer++;
    if (missileSpawnTimer > 300 && !missileActive && distance > 800) {
      missileSpawnTimer = 0;
      if (Math.random() < 0.4) spawnMissile();
    }

    for (let obs of obstacles) obs.x -= speed;
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    updateMissile();
    updateMissileParticles();

    if (checkObstacleCollision()) {
      gameOver('撞上了地面障碍物');
      return;
    }
    if (checkMissileCollision()) {
      gameOver('被伊朗导弹击中');
      return;
    }

    for (let c of clouds) {
      c.x -= c.speed;
      if (c.x + c.w < 0) {
        c.x = CANVAS_W + 20;
        c.y = 40 + Math.random() * 120;
      }
    }

    updateParticles();

    if (shake > 0) shake *= 0.88;
  }

  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, '#4A90D9');
    grad.addColorStop(0.6, '#87CEEB');
    grad.addColorStop(1, '#B0E0E6');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CANVAS_W, GROUND_Y);
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let c of clouds) {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x - c.w / 3, c.y + 5, c.w / 3, c.h / 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x + c.w / 3, c.y + 3, c.w / 3, c.h / 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawScenery() {
    // 远山
    ctx.fillStyle = 'rgba(100, 140, 100, 0.35)';
    const farOffset = bgScrollFar % 160;
    for (let i = -1; i <= 6; i++) {
      const hill = farHills[i % farHills.length];
      if (!hill) continue;
      const x = i * 160 - farOffset;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.quadraticCurveTo(x + hill.w / 2, GROUND_Y - hill.h, x + hill.w, GROUND_Y);
      ctx.fill();
    }
    // 近处灌木
    ctx.fillStyle = 'rgba(60, 100, 60, 0.55)';
    const nearOffset = bgScrollNear % 100;
    for (let i = -1; i <= 10; i++) {
      const bush = nearBushes[i % nearBushes.length];
      if (!bush) continue;
      const x = i * 100 - nearOffset;
      ctx.beginPath();
      ctx.ellipse(x, GROUND_Y - bush.h / 2, bush.w / 2, bush.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);
    ctx.fillStyle = '#6B5335';
    for (let i = 0; i < CANVAS_W; i += 40) {
      const offset = (frameCount * speed * 0.5) % 40;
      ctx.fillRect(i - offset, GROUND_Y, 20, 6);
    }
    ctx.fillStyle = '#5a8a3a';
    ctx.fillRect(0, GROUND_Y - 4, CANVAS_W, 6);
    ctx.fillStyle = '#4a7a2a';
    for (let i = 0; i < CANVAS_W; i += 16) {
      const offset = (frameCount * speed * 0.8) % 16;
      ctx.fillRect(i - offset, GROUND_Y - 6, 4, 4);
    }
  }

  function drawMissileWarning() {
    if (!missileActive) return;
    if (missile.warnTimer <= 0) return;
    if (Math.floor(missile.warnTimer / 8) % 2 === 0) {
      ctx.fillStyle = 'rgba(255, 40, 40, 0.85)';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('⚠ 导弹来袭 ⚠', CANVAS_W / 2, 60);
      ctx.textAlign = 'left';
    }
  }

  function drawMissile() {
    if (!missileActive || !missile.active) return;
    if (missile.warnTimer > 0) return;

    for (let t of missile.trail) {
      ctx.fillStyle = 'rgba(255,' + (80 + t.life * 100) + ',0,' + (t.life * 0.7) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 4 + t.life * 8, 0, Math.PI * 2);
      ctx.fill();
    }

    const mx = missile.x, my = missile.y, mw = missile.w, mh = missile.h;

    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.moveTo(mx + mw, my + mh / 2);
    ctx.lineTo(mx + mw - 30, my);
    ctx.lineTo(mx + mw - 30, my + mh);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(mx, my + 4, mw - 30, mh - 8);

    ctx.fillStyle = '#ff2222';
    ctx.beginPath();
    ctx.arc(mx + mw - 40, my + mh / 2, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#333';
    ctx.fillRect(mx + 10, my - 4, 15, 6);
    ctx.fillRect(mx + 10, my + mh - 2, 15, 6);

    ctx.font = 'bold 14px "Courier New"';
    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';
    ctx.fillText('☢', mx + mw - 55, my + mh / 2 + 5);
    ctx.textAlign = 'left';

    ctx.fillStyle = 'rgba(255, 200, 0, 0.6)';
    ctx.beginPath();
    ctx.ellipse(mx - 5, my + mh / 2, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.ellipse(mx - 10, my + mh / 2, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMissileParticles() {
    for (let p of missileParticles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacles() {
    for (let obs of obstacles) {
      if (obs.type === 'cactus') {
        ctx.fillStyle = '#2d6a2d';
        ctx.fillRect(obs.x + 6, obs.y, obs.w - 12, obs.h);
        ctx.fillRect(obs.x, obs.y + obs.h * 0.3, 8, obs.h * 0.4);
        ctx.fillRect(obs.x + obs.w - 8, obs.y + obs.h * 0.2, 8, obs.h * 0.5);
        ctx.fillStyle = '#3d8a3d';
        ctx.fillRect(obs.x + 8, obs.y, 6, obs.h);
      } else if (obs.type === 'crate') {
        ctx.fillStyle = '#8B6914';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#5a4510';
        ctx.lineWidth = 3;
        ctx.strokeRect(obs.x + 2, obs.y + 2, obs.w - 4, obs.h - 4);
        ctx.beginPath();
        ctx.moveTo(obs.x + 4, obs.y + 4);
        ctx.lineTo(obs.x + obs.w - 4, obs.y + obs.h - 4);
        ctx.moveTo(obs.x + obs.w - 4, obs.y + 4);
        ctx.lineTo(obs.x + 4, obs.y + obs.h - 4);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#666';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.fillStyle = '#888';
        ctx.fillRect(obs.x + 2, obs.y + 2, obs.w - 4, obs.h - 4);
        ctx.fillStyle = '#ffcc00';
        for (let i = 0; i < obs.h; i += 12) {
          ctx.fillRect(obs.x, obs.y + i, obs.w, 6);
        }
        ctx.fillStyle = '#444';
        ctx.fillRect(obs.x - 2, obs.y + obs.h - 8, obs.w + 4, 8);
      }
    }
  }

  function drawStandingSoldier(px, py, pw, bodyH, isJumping, cycle) {
    // 更流畅的四肢摆动
    const swing = isJumping ? 0 : Math.sin(cycle) * 9;
    const legSwing = isJumping ? 0 : Math.sin(cycle) * 8;
    const armSwing = isJumping ? -4 : Math.sin(cycle) * 7;

    // 后腿
    ctx.fillStyle = '#3a4a24';
    ctx.fillRect(px + 19 - legSwing, py + bodyH + 6, 9, 16);
    ctx.fillStyle = '#2e3a1e';
    ctx.fillRect(px + 18 - legSwing, py + bodyH + 12, 11, 5);
    ctx.fillStyle = '#4a5a30';
    ctx.fillRect(px + 19 - legSwing, py + bodyH + 20, 9, 4);
    ctx.fillStyle = '#151510';
    ctx.fillRect(px + 16 - legSwing, py + bodyH + 22, 14, 6);
    ctx.fillStyle = '#000000';
    ctx.fillRect(px + 16 - legSwing, py + bodyH + 26, 14, 2);
    ctx.fillStyle = '#5a4a28';
    ctx.fillRect(px + 17 - legSwing, py + bodyH + 23, 12, 2);

    // 前腿
    ctx.fillStyle = '#4a5a30';
    ctx.fillRect(px + 8 + legSwing, py + bodyH + 6, 9, 16);
    ctx.fillStyle = '#2e3a1e';
    ctx.fillRect(px + 7 + legSwing, py + bodyH + 12, 11, 5);
    ctx.fillStyle = '#3a4a24';
    ctx.fillRect(px + 8 + legSwing, py + bodyH + 20, 9, 4);
    ctx.fillStyle = '#151510';
    ctx.fillRect(px + 5 + legSwing, py + bodyH + 22, 14, 6);
    ctx.fillStyle = '#000000';
    ctx.fillRect(px + 5 + legSwing, py + bodyH + 26, 14, 2);
    ctx.fillStyle = '#4a3a20';
    ctx.fillRect(px + 6 + legSwing, py + bodyH + 23, 12, 2);

    // 背包
    ctx.fillStyle = '#3a4a24';
    ctx.fillRect(px - 2, py + 16, 8, 22);
    ctx.fillStyle = '#2a3818';
    ctx.fillRect(px - 2, py + 20, 8, 3);
    ctx.fillRect(px - 2, py + 28, 8, 3);

    // 身体
    ctx.fillStyle = '#5a6b3a';
    ctx.fillRect(px + 6, py + 14, pw - 12, bodyH - 8);
    ctx.fillStyle = '#4a5a2a';
    ctx.fillRect(px + 8, py + 16, pw - 16, 16);
    ctx.fillStyle = '#2e3a1e';
    ctx.fillRect(px + 8, py + 18, pw - 16, 14);
    ctx.fillStyle = '#1e2814';
    ctx.fillRect(px + 10, py + 20, 7, 8);
    ctx.fillRect(px + 19, py + 20, 7, 8);
    ctx.fillStyle = '#5a4a28';
    ctx.fillRect(px + 12, py + 22, 3, 2);
    ctx.fillRect(px + 21, py + 22, 3, 2);
    ctx.fillStyle = '#3a2e18';
    ctx.fillRect(px + 6, py + 32, pw - 12, 4);
    ctx.fillStyle = '#8a7a3a';
    ctx.fillRect(px + 16, py + 32, 4, 4);
    ctx.fillStyle = '#7a8a4a';
    ctx.fillRect(px + 5, py + 14, 5, 3);
    ctx.fillRect(px + pw - 10, py + 14, 5, 3);
    ctx.fillStyle = '#c0a040';
    ctx.fillRect(px + 6, py + 15, 3, 2);
    ctx.fillRect(px + pw - 9, py + 15, 3, 2);

    // 后手臂
    ctx.save();
    ctx.translate(px + 4, py + 18);
    ctx.rotate(swing * 0.05);
    ctx.fillStyle = '#4a5a30';
    ctx.fillRect(-4, 0, 8, 14);
    ctx.fillStyle = '#2a3618';
    ctx.fillRect(-4, 12, 8, 4);
    ctx.fillStyle = '#3a4a24';
    ctx.fillRect(-4, 16, 8, 6);
    ctx.fillStyle = '#e0b080';
    ctx.beginPath();
    ctx.arc(0, 22, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-4, 20, 8, 3);
    ctx.restore();

    // 前手臂 + 枪
    ctx.save();
    ctx.translate(px + pw - 6, py + 18);
    ctx.rotate(-swing * 0.05);
    ctx.fillStyle = '#5a6b3a';
    ctx.fillRect(-4, 0, 8, 14);
    ctx.fillStyle = '#3a4a24';
    ctx.fillRect(-4, 12, 8, 4);
    ctx.fillStyle = '#4a5a30';
    ctx.fillRect(-4, 16, 8, 6);
    ctx.fillStyle = '#e0b080';
    ctx.beginPath();
    ctx.arc(0, 22, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-4, 20, 8, 3);

    // 枪（随手臂摆动）
    ctx.fillStyle = '#3a2a18';
    ctx.fillRect(-6, 16, 10, 5);
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(4, 17, 22, 4);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(24, 18, 8, 2);
    ctx.fillStyle = '#333333';
    ctx.fillRect(8, 20, 5, 9);
    ctx.fillStyle = '#444444';
    ctx.fillRect(9, 21, 3, 7);
    ctx.fillStyle = '#2a2018';
    ctx.fillRect(15, 20, 4, 6);
    ctx.fillStyle = '#555555';
    ctx.fillRect(20, 15, 2, 3);
    ctx.restore();

    // 脖子
    ctx.fillStyle = '#e0b080';
    ctx.fillRect(px + 14, py + 10, 8, 6);
    ctx.fillStyle = '#c09060';
    ctx.fillRect(px + 14, py + 10, 8, 2);

    // 头
    ctx.fillStyle = '#e0b080';
    ctx.beginPath();
    ctx.arc(px + 20, py + 8, 8, 0, Math.PI * 2);
    ctx.fill();

    // 钢盔
    ctx.fillStyle = '#4a5a2a';
    ctx.beginPath();
    ctx.arc(px + 20, py + 4, 11, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(px + 9, py + 2, 22, 6);
    ctx.fillStyle = '#5a6a3a';
    ctx.beginPath();
    ctx.arc(px + 18, py + 2, 6, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#3a4a1a';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(px + 10 + i * 4, py + 2);
      ctx.lineTo(px + 14 + i * 4, py + 8);
      ctx.stroke();
    }
    ctx.fillStyle = '#3a4a1a';
    ctx.fillRect(px + 10, py + 2, 20, 2);

    // 眼睛
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(px + 23, py + 6, 2, 0, Math.PI * 2);
    ctx.fill();

    // 臂章
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + pw - 10, py + 26, 6, 5);
    ctx.fillStyle = '#0038b8';
    ctx.fillRect(px + pw - 10, py + 27, 6, 2);
    ctx.fillRect(px + pw - 10, py + 29, 6, 2);
  }

  function drawDuckingSoldier(px, py, pw) {
    // 身体压低
    ctx.fillStyle = '#3a4a30';
    ctx.fillRect(px + 4, py + 18, 10, 8);
    ctx.fillRect(px + 20, py + 18, 10, 8);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(px + 2, py + 24, 14, 6);
    ctx.fillRect(px + 20, py + 24, 14, 6);

    ctx.fillStyle = '#5a6b3a';
    ctx.fillRect(px + 6, py + 6, pw - 12, 14);
    ctx.fillStyle = '#4a5a2a';
    ctx.fillRect(px + 8, py + 8, pw - 16, 10);
    ctx.fillStyle = '#3a4a20';
    ctx.fillRect(px + 10, py + 10, 6, 6);
    ctx.fillRect(px + 20, py + 10, 6, 6);

    // 手臂撑地
    ctx.fillStyle = '#5a6b3a';
    ctx.fillRect(px - 2, py + 8, 10, 6);
    ctx.fillRect(px + pw - 8, py + 8, 10, 6);

    // 头
    ctx.fillStyle = '#4a5a2a';
    ctx.beginPath();
    ctx.arc(px + pw / 2 + 2, py + 4, 12, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(px + pw / 2 - 10, py + 2, 24, 6);
    ctx.strokeStyle = '#3a4a1a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(px + pw / 2 - 10 + i * 6, py + 2);
      ctx.lineTo(px + pw / 2 - 6 + i * 6, py + 8);
      ctx.stroke();
    }
    ctx.fillStyle = '#e0b080';
    ctx.beginPath();
    ctx.arc(px + pw / 2 + 8, py + 6, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(px + pw / 2 + 10, py + 5, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    // 下滑/站立高度插值，过渡更顺滑
    const duckT = player.duckSlide;
    const standH = player.h;
    const duckH = player.duckH;
    const curH = standH + (duckH - standH) * duckT;
    const py = GROUND_Y - curH;
    const pw = player.w;

    // 压缩/拉伸
    const squash = player.squash;
    const stretch = player.jumpStretch;
    const scaleX = 1 + squash * 0.12 - stretch * 0.05;
    const scaleY = 1 - squash * 0.12 + stretch * 0.08;

    ctx.save();

    // 以脚底为基准缩放
    ctx.translate(PLAYER_X + pw / 2, GROUND_Y);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-(PLAYER_X + pw / 2), -GROUND_Y);

    if (gameState === 'gameover') ctx.globalAlpha = 0.45;

    if (duckT > 0.5) {
      drawDuckingSoldier(PLAYER_X, py, pw);
    } else {
      drawStandingSoldier(PLAYER_X, py, pw, 40, player.isJumping, player.runCycle);
    }

    ctx.restore();
  }

  function drawDustParticles() {
    for (let d of dustParticles) {
      ctx.globalAlpha = d.life / d.maxLife * 0.7;
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  function drawUI() {
    if (gameState === 'start') {
      ctx.fillStyle = 'rgba(10, 20, 30, 0.8)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('🎖️ 士兵跑酷', CANVAS_W / 2, 140);
      ctx.font = '24px "Courier New", monospace';
      ctx.fillStyle = '#e0f0b0';
      ctx.fillText('躲避伊朗导弹的追击！', CANVAS_W / 2, 200);
      ctx.font = '20px "Courier New", monospace';
      ctx.fillStyle = '#b8e0a0';
      ctx.fillText('空格 / ↑ 跳跃    ↓ 下滑', CANVAS_W / 2, 260);
      ctx.fillStyle = '#ffd966';
      ctx.font = '26px "Courier New", monospace';
      ctx.fillText('点击屏幕开始', CANVAS_W / 2, 330);
      ctx.textAlign = 'left';
    } else if (gameState === 'gameover') {
      ctx.fillStyle = 'rgba(20, 10, 5, 0.85)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.textAlign = 'center';
      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.fillStyle = '#ff4444';
      ctx.fillText('💥 ' + deathReason, CANVAS_W / 2, 160);
      ctx.font = '30px "Courier New", monospace';
      ctx.fillStyle = '#e0f0b0';
      ctx.fillText('距离: ' + Math.floor(distance / 10) + ' m', CANVAS_W / 2, 240);
      if (highScore > 0) {
        ctx.font = '22px "Courier New", monospace';
        ctx.fillStyle = '#ffd966';
        ctx.fillText('最佳: ' + highScore + ' m', CANVAS_W / 2, 290);
      }
      ctx.font = '24px "Courier New", monospace';
      ctx.fillStyle = '#b8e0a0';
      ctx.fillText('点击重新开始', CANVAS_W / 2, 360);
      ctx.textAlign = 'left';
    }
  }

  function draw() {
    // 屏幕震动
    ctx.save();
    if (shake > 0.5) {
      ctx.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake
      );
    }

    drawSky();
    drawClouds();
    drawScenery();
    drawGround();
    drawObstacles();
    drawMissileWarning();
    drawMissile();
    drawMissileParticles();
    drawDustParticles();
    drawPlayer();
    drawParticles();
    drawUI();

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function jump() {
    if (gameState === 'start') { resetGame(); return; }
    if (gameState === 'gameover') { resetGame(); return; }
    if (!player.isJumping && gameState === 'playing') {
      player.vy = JUMP_FORCE;
      player.isJumping = true;
      player.isDucking = false;
      player.jumpStretch = 1;   // 起跳拉伸
    }
  }

  function duckStart() {
    if (gameState === 'playing' && !player.isJumping) {
      player.isDucking = true;
    }
  }

  function duckEnd() {
    player.isDucking = false;
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      jump();
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      duckStart();
    }
  });

  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      duckEnd();
    }
  });

  const jumpBtn = document.getElementById('jumpBtn');
  const duckBtn = document.getElementById('duckBtn');

  jumpBtn.addEventListener('mousedown', function(e) { e.preventDefault(); jump(); });
  jumpBtn.addEventListener('touchstart', function(e) { e.preventDefault(); jump(); }, { passive: false });

  duckBtn.addEventListener('mousedown', function(e) { e.preventDefault(); duckStart(); });
  duckBtn.addEventListener('mouseup', function(e) { e.preventDefault(); duckEnd(); });
  duckBtn.addEventListener('mouseleave', duckEnd);
  duckBtn.addEventListener('touchstart', function(e) { e.preventDefault(); duckStart(); }, { passive: false });
  duckBtn.addEventListener('touchend', function(e) { e.preventDefault(); duckEnd(); }, { passive: false });
  duckBtn.addEventListener('touchcancel', duckEnd);

  canvas.addEventListener('click', function() {
    if (gameState === 'start' || gameState === 'gameover') {
      resetGame();
    }
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (gameState === 'start' || gameState === 'gameover') {
      resetGame();
    }
  }, { passive: false });

  initClouds();
  initScenery();
  loop();

})();
</script>
</body>
</html>
