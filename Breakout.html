<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 · Breakout</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #12141c;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Courier New', Courier, monospace; padding: 12px;
  }
  .game-wrapper {
    background: #1e2230; padding: 18px 18px 22px; border-radius: 28px;
    box-shadow: 0 12px 0 #0a0c14, 0 16px 24px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center;
  }
  .top-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 10px;
  }
  .back-btn {
    background: #2e3448; color: #d4e8b0; border: none; border-radius: 12px;
    padding: 9px 16px; font-family: inherit; font-size: 0.95rem; font-weight: bold;
    cursor: pointer; box-shadow: 0 5px 0 #12141c; text-decoration: none; display: inline-block;
  }
  .back-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #12141c; }
  .hud {
    display: flex; gap: 10px; align-items: center;
    color: #e0f0c0; font-size: 1rem; font-weight: bold;
  }
  .hud .pill {
    background: #12141c; padding: 6px 14px; border-radius: 20px;
    box-shadow: inset 0 -3px 0 #060810;
  }
  .hud .pill span { color: #ffd966; }
  canvas {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 14px; background: #0a0c14;
    box-shadow: inset 0 0 0 4px #2a2f42, 0 6px 0 #0a0c14;
    cursor: none; max-width: 640px; touch-action: none;
  }
  .hint {
    margin-top: 10px; color: #7a8ba0; font-size: 0.9rem; font-weight: bold;
    letter-spacing: 1px;
  }
  @media (max-width: 600px) {
    .hud { font-size: 0.85rem; }
    .back-btn { font-size: 0.8rem; padding: 7px 12px; }
    .hint { font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="top-bar">
    <a class="back-btn" href="https://XJY2014.github.io/game/index.html">← 返回</a>
    <div class="hud">
      <div class="pill">关卡 <span id="levelDisplay">1</span></div>
      <div class="pill">分数 <span id="scoreDisplay">0</span></div>
      <div class="pill">生命 <span id="livesDisplay">♥♥♥</span></div>
    </div>
  </div>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div class="hint">← → 移动 / 鼠标或手指拖动 / 空格发球</div>
</div>

<script>
(function() {
  'use strict';

  const W = 640;
  const H = 480;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const levelSpan = document.getElementById('levelDisplay');
  const livesSpan = document.getElementById('livesDisplay');

  let gameState = 'start';
  let score = 0;
  let level = 1;
  let lives = 3;

  const paddle = {
    x: W / 2 - 55,
    y: H - 40,
    w: 110,
    baseW: 110,
    h: 14,
    speed: 7,
    expandTimer: 0
  };

  let balls = [];
  let bricks = [];
  let powerups = [];
  let particles = [];
  let stars = [];

  let leftPressed = false;
  let rightPressed = false;
  let launchReady = false;
  let slowTimer = 0;
  let pierceTimer = 0;

  const BASE_BALL_SPEED = 5.5;

  const BRICK_COLORS = [
    '#ff5252',
    '#ffa726',
    '#ffee58',
    '#66bb6a',
    '#42a5f5',
    '#ab47bc'
  ];

  function initStars() {
    stars = [];
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.7 + 0.2
      });
    }
  }

  function makeBall(x, y, vx, vy) {
    return { x: x, y: y, r: 8, vx: vx, vy: vy, trail: [] };
  }

  function resetBallOnPaddle() {
    balls = [makeBall(paddle.x + paddle.w / 2, paddle.y - 9, 0, 0)];
    launchReady = true;
  }

  function launchBall() {
    if (!launchReady) return;
    launchReady = false;
    const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    const speed = slowTimer > 0 ? BASE_BALL_SPEED * 0.7 : BASE_BALL_SPEED;
    balls[0].vx = Math.cos(angle) * speed;
    balls[0].vy = Math.sin(angle) * speed;
  }

  function buildLevel(n) {
    bricks = [];
    const cols = 10;
    const rows = Math.min(4 + Math.floor((n - 1) / 2), 7);
    const brickW = (W - 80) / cols;
    const brickH = 22;
    const startX = 40;
    const startY = 70;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (n >= 3 && Math.random() < 0.12) continue;
        if (n >= 5 && (r + c) % 2 === 0 && Math.random() < 0.1) continue;

        const hp = n >= 4 && r < 2 ? 2 : 1;
        bricks.push({
          x: startX + c * brickW,
          y: startY + r * brickH,
          w: brickW - 4,
          h: brickH - 4,
          color: BRICK_COLORS[r % BRICK_COLORS.length],
          hp: hp,
          maxHp: hp
        });
      }
    }
  }

  function resetGame() {
    gameState = 'playing';
    score = 0;
    level = 1;
    lives = 3;
    paddle.w = paddle.baseW;
    paddle.x = W / 2 - paddle.w / 2;
    paddle.expandTimer = 0;
    slowTimer = 0;
    pierceTimer = 0;
    powerups = [];
    particles = [];
    buildLevel(level);
    resetBallOnPaddle();
    updateHUD();
  }

  function updateHUD() {
    scoreSpan.textContent = score;
    levelSpan.textContent = level;
    livesSpan.textContent = '♥'.repeat(Math.max(0, lives));
  }

  function spawnPowerup(x, y) {
    const types = ['expand', 'multi', 'pierce', 'life', 'slow'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x: x, y: y, w: 22, h: 22, type: type, vy: 2 });
  }

  function createBrickExplosion(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 1,
        life: 1.0,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function updateParticles() {
    for (let p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.03;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function clampPaddle() {
    if (paddle.x < 10) paddle.x = 10;
    if (paddle.x + paddle.w > W - 10) paddle.x = W - 10 - paddle.w;
  }

  function updatePaddle() {
    if (leftPressed) paddle.x -= paddle.speed;
    if (rightPressed) paddle.x += paddle.speed;

    if (paddle.expandTimer > 0) {
      paddle.expandTimer--;
      if (paddle.expandTimer === 0) {
        const cx = paddle.x + paddle.w / 2;
        paddle.w = paddle.baseW;
        paddle.x = cx - paddle.w / 2;
      }
    }
    clampPaddle();
  }

  function updateBalls() {
    for (let b of balls) {
      b.trail.unshift({ x: b.x, y: b.y, life: 0.6 });
      if (b.trail.length > 8) b.trail.pop();
      for (let t of b.trail) t.life -= 0.06;
      b.trail = b.trail.filter(t => t.life > 0);

      if (launchReady) {
        b.x = paddle.x + paddle.w / 2;
        b.y = paddle.y - 9;
        continue;
      }

      b.x += b.vx;
      b.y += b.vy;

      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }

      if (b.y + b.r > paddle.y &&
          b.y - b.r < paddle.y + paddle.h &&
          b.x > paddle.x - b.r &&
          b.x < paddle.x + paddle.w + b.r &&
          b.vy > 0) {
        const hitPos = (b.x - paddle.x) / paddle.w;
        const angle = -Math.PI / 2 + (hitPos - 0.5) * 1.6;
        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        b.vx = Math.cos(angle) * speed;
        b.vy = Math.sin(angle) * speed;
        b.y = paddle.y - b.r - 1;
      }
    }

    balls = balls.filter(b => b.y - b.r < H + 40);
  }

  function updateBricks() {
    for (let i = bricks.length - 1; i >= 0; i--) {
      const brick = bricks[i];
      for (let j = balls.length - 1; j >= 0; j--) {
        const b = balls[j];
        if (b.x + b.r > brick.x &&
            b.x - b.r < brick.x + brick.w &&
            b.y + b.r > brick.y &&
            b.y - b.r < brick.y + brick.h) {

          const overlapLeft = (b.x + b.r) - brick.x;
          const overlapRight = (brick.x + brick.w) - (b.x - b.r);
          const overlapTop = (b.y + b.r) - brick.y;
          const overlapBottom = (brick.y + brick.h) - (b.y - b.r);
          const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

          if (minOverlap === overlapLeft) { b.vx = -Math.abs(b.vx); b.x = brick.x - b.r; }
          else if (minOverlap === overlapRight) { b.vx = Math.abs(b.vx); b.x = brick.x + brick.w + b.r; }
          else if (minOverlap === overlapTop) { b.vy = -Math.abs(b.vy); b.y = brick.y - b.r; }
          else { b.vy = Math.abs(b.vy); b.y = brick.y + brick.h + b.r; }

          if (pierceTimer <= 0) {
            brick.hp--;
          } else {
            brick.hp = 0;
          }

          if (brick.hp <= 0) {
            createBrickExplosion(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
            score += 10 * brick.maxHp;
            if (Math.random() < 0.15) spawnPowerup(brick.x + brick.w / 2, brick.y);
            bricks.splice(i, 1);
            updateHUD();
          } else {
            score += 5;
            updateHUD();
          }

          if (pierceTimer <= 0) break;
        }
      }
    }
  }

  function updatePowerups() {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy;

      if (p.y + p.h > paddle.y &&
          p.y < paddle.y + paddle.h &&
          p.x + p.w > paddle.x &&
          p.x < paddle.x + paddle.w) {

        applyPowerup(p.type);
        powerups.splice(i, 1);
        continue;
      }

      if (p.y > H + 30) powerups.splice(i, 1);
    }
  }

  function applyPowerup(type) {
    if (type === 'expand') {
      if (paddle.expandTimer === 0) {
        const cx = paddle.x + paddle.w / 2;
        paddle.w = paddle.baseW * 1.5;
        paddle.x = cx - paddle.w / 2;
      }
      paddle.expandTimer = 480;
      clampPaddle();
    } else if (type === 'multi') {
      const origin = balls[0];
      if (origin) {
        for (let k = 0; k < 2; k++) {
          const angle = Math.atan2(origin.vy, origin.vx) + (k === 0 ? -0.6 : 0.6);
          const speed = Math.sqrt(origin.vx * origin.vx + origin.vy * origin.vy) || BASE_BALL_SPEED;
          balls.push(makeBall(origin.x, origin.y, Math.cos(angle) * speed, Math.sin(angle) * speed));
        }
      }
    } else if (type === 'pierce') {
      pierceTimer = 300;
    } else if (type === 'life') {
      lives++;
      updateHUD();
    } else if (type === 'slow') {
      slowTimer = 300;
      for (let b of balls) {
        b.vx *= 0.7;
        b.vy *= 0.7;
      }
    }
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameState = 'gameover';
    } else {
      paddle.w = paddle.baseW;
      paddle.x = W / 2 - paddle.w / 2;
      paddle.expandTimer = 0;
      slowTimer = 0;
      pierceTimer = 0;
      resetBallOnPaddle();
    }
  }

  function checkLevelClear() {
    if (bricks.length === 0) {
      if (level >= 5) {
        gameState = 'win';
      } else {
        level++;
        buildLevel(level);
        updateHUD();
        paddle.w = paddle.baseW;
        paddle.x = W / 2 - paddle.w / 2;
        resetBallOnPaddle();
      }
    }
  }

  function update() {
    for (let s of stars) {
      s.y += 0.15;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    if (gameState !== 'playing') return;

    if (slowTimer > 0) slowTimer--;
    if (pierceTimer > 0) pierceTimer--;

    updatePaddle();
    updateBalls();
    updateBricks();
    updatePowerups();
    updateParticles();

    if (balls.length === 0) {
      loseLife();
      return;
    }

    checkLevelClear();
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0c14');
    grad.addColorStop(1, '#1a1e2c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (let s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPaddle() {
    const grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, '#7ec8ff');
    grad.addColorStop(1, '#3a7abf');
    ctx.fillStyle = grad;
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(paddle.x + 4, paddle.y + 2, paddle.w - 8, 2);
  }

  function drawBalls() {
    for (let b of balls) {
      for (let t of b.trail) {
        ctx.globalAlpha = t.life * 0.7;
        ctx.fillStyle = pierceTimer > 0 ? '#ff77ff' : '#ffd966';
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * t.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.shadowColor = pierceTimer > 0 ? '#ff44ff' : '#ffee66';
      ctx.shadowBlur = 14;
      ctx.fillStyle = pierceTimer > 0 ? '#ff99ff' : '#ffe066';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(b.x - 2, b.y - 2, b.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBricks() {
    for (let brick of bricks) {
      ctx.fillStyle = brick.color;
      ctx.fillRect(brick.x, brick.y, brick.w, brick.h);

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(brick.x, brick.y, brick.w, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(brick.x, brick.y + brick.h - 3, brick.w, 3);

      if (brick.hp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(brick.x + brick.w / 2 - 4, brick.y + brick.h / 2 - 4, 8, 8);
        ctx.fillStyle = '#fff';
        ctx.fillRect(brick.x + brick.w / 2 - 3, brick.y + brick.h / 2 - 3, 6, 6);
      }
    }
  }

  function drawPowerups() {
    for (let p of powerups) {
      let color = '#fff';
      let label = '?';
      if (p.type === 'expand') { color = '#4fc3f7'; label = '↔'; }
      else if (p.type === 'multi') { color = '#ffb74d'; label = '●●'; }
      else if (p.type === 'pierce') { color = '#ba68c8'; label = '⚡'; }
      else if (p.type === 'life') { color = '#ef5350'; label = '♥'; }
      else if (p.type === 'slow') { color = '#81c784'; label = '⏱'; }

      ctx.fillStyle = color;
      ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, 3);

      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px "Courier New"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, p.x, p.y + 1);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawEffects() {
    if (slowTimer > 0) {
      ctx.fillStyle = 'rgba(100, 200, 255, 0.08)';
      ctx.fillRect(0, 0, W, H);
    }
    if (pierceTimer > 0) {
      ctx.fillStyle = 'rgba(255, 100, 255, 0.06)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawUI() {
    if (gameState === 'start') {
      ctx.fillStyle = 'rgba(5, 8, 15, 0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      ctx.font = 'bold 46px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('打砖块', W / 2, 160);

      ctx.font = '20px "Courier New", monospace';
      ctx.fillStyle = '#b8e0a0';
      ctx.fillText('移动挡板反弹小球，打光所有砖块', W / 2, 220);

      ctx.font = '18px "Courier New", monospace';
      ctx.fillStyle = '#8faa7a';
      ctx.fillText('← → 移动 / 鼠标或手指拖动', W / 2, 270);
      ctx.fillText('空格或点击发球', W / 2, 300);

      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('点击开始', W / 2, 370);

      ctx.textAlign = 'left';
    } else if (gameState === 'gameover') {
      ctx.fillStyle = 'rgba(30, 5, 5, 0.85)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      ctx.font = 'bold 48px "Courier New", monospace';
      ctx.fillStyle = '#ff5252';
      ctx.fillText('游戏结束', W / 2, 180);

      ctx.font = '26px "Courier New", monospace';
      ctx.fillStyle = '#e0f0b0';
      ctx.fillText('分数: ' + score, W / 2, 250);
      ctx.fillText('到达关卡: ' + level, W / 2, 290);

      ctx.font = '22px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('点击重新开始', W / 2, 370);

      ctx.textAlign = 'left';
    } else if (gameState === 'win') {
      ctx.fillStyle = 'rgba(5, 25, 10, 0.88)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      ctx.font = 'bold 52px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('通关！', W / 2, 180);

      ctx.font = '28px "Courier New", monospace';
      ctx.fillStyle = '#b8e0a0';
      ctx.fillText('最终分数: ' + score, W / 2, 260);

      ctx.font = '22px "Courier New", monospace';
      ctx.fillStyle = '#ffd966';
      ctx.fillText('点击重新开始', W / 2, 360);

      ctx.textAlign = 'left';
    }
  }

  function draw() {
    drawBackground();
    drawBricks();
    drawPowerups();
    drawPaddle();
    drawBalls();
    drawParticles();
    drawEffects();
    drawUI();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { leftPressed = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { rightPressed = true; e.preventDefault(); }
    if (e.key === ' ') {
      e.preventDefault();
      if (gameState === 'start' || gameState === 'gameover' || gameState === 'win') {
        resetGame();
      } else if (launchReady) {
        launchBall();
      }
    }
  });

  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
  });

  function pointerMove(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    const x = (clientX - rect.left) * scale;
    paddle.x = x - paddle.w / 2;
    clampPaddle();
  }

  canvas.addEventListener('mousemove', function(e) {
    if (gameState === 'playing') pointerMove(e.clientX);
  });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (gameState === 'playing' && e.touches.length > 0) {
      pointerMove(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener('mousedown', function() {
    if (gameState === 'start' || gameState === 'gameover' || gameState === 'win') {
      resetGame();
    } else if (launchReady) {
      launchBall();
    }
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (gameState === 'start' || gameState === 'gameover' || gameState === 'win') {
      resetGame();
    } else if (launchReady) {
      launchBall();
    }
  }, { passive: false });

  initStars();
  buildLevel(1);
  resetBallOnPaddle();
  updateHUD();
  loop();
